name: seq2ribo
channels:
  - pytorch
  - nvidia
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.12
  
  # PyTorch with CUDA 11.8 (match your system's nvcc version)
  # To check your CUDA version: nvcc --version
  - pytorch=2.5.1
  - pytorch-cuda=11.8
  - torchaudio
  - torchvision
  
  # Core scientific packages
  - numpy
  - pandas
  - scipy
  - matplotlib

  # Jupyter (local demo notebooks under notebooks/)
  # Versions aligned with a verified conda-forge stack (linux-64, Apr 2026)
  - notebook>=7.5
  - ipykernel>=7.0
  - jupyterlab>=4.5
  
  # RNA folding (ViennaRNA)
  - viennarna>=2.6
  
  # ML utilities (available via conda)
  - einops
  - transformers
  - pip

# After creating environment, install mamba-ssm via pip (not on conda-forge):
#   conda activate seq2ribo
#   python -m pip install --no-build-isolation mamba-ssm causal-conv1d
# Example resolved PyPI versions: mamba-ssm 2.3.x, causal-conv1d 1.6.x
